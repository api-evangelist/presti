aid: presti
name: Presti
description: 'Presti (operated by Teker AI SAS, France) is an AI agent platform for automated product
  image and video production at scale. eCommerce teams, retailers, and brands write plain-language
  briefs — attaching product images, packshots, CSVs, or inspiration URLs — and Presti generates
  studio-quality product staging, 360-degree spins, image-to-video, close-ups, variants, dimension
  overlays, and infographics, then routes them through a collaborative review-and-approval workspace.
  It orchestrates multiple third-party generative models (Google Gemini and Veo, OpenAI GPT Image,
  Flux, Kling, Seedance, Grok, Photoroom) and encodes visual identity via reusable Brand Skills.
  API access is offered on the Enterprise plan but is not publicly documented.'
